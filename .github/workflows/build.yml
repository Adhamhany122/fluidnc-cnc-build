name: Build Custom FluidNC Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Unzip and Check Files
        run: |
          sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip project files
        run: |
          unzip -o FluidNC-4.1.0-ESP32S3-Custom.zip -d extracted_project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Run PlatformIO Build for ESP32-S3
        run: |
          TARGET_DIR=$(find extracted_project -name "platformio.ini" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          echo "=== بدء تجميع بيئة wifi_s3 ==="
          pio run -e wifi_s3

      - name: Upload Firmware Binary
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: extracted_project/**/.pio/build/wifi_s3/*.bin
          
