name: Build Custom FluidNC Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          unzip FluidNC-4.1.0-ESP32S3-Custom.zip -d extracted_project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Run PlatformIO Build
        run: |
          TARGET_DIR=$(find extracted_project -name "platformio.ini" -exec dirname {} \;)
          cd "$TARGET_DIR"
          echo "=== عرض البيئات المتاحة في مشروعك ==="
          pio project config
          echo "=== بدء التجميع الشامل ==="
          pio run

      - name: Upload Firmware Binary
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: 'extracted_project/**/.pio/build/**/*.bin'
          
